name: Tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'doc/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      testNetwork:
        description: 'Run the tests that require network connectivity'
        required: false
        default: '0'

# A push supersedes the run it interrupts: without this, every push leaves the
# jobs of the previous runs running, and this workflow takes half an hour
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:

    name: ${{ matrix.name }}

    runs-on: ${{ matrix.os }}

    # A build of the dependency tree that stalls - a locked cache, a mirror
    # that never answers - must not hold a runner for the six hours of the
    # default timeout
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux, x64
          - os: ubuntu-24.04-arm
            name: Linux, arm64
          - os: windows-2022
            name: Windows, x64
          - os: windows-11-arm
            name: Windows, arm64
          - os: macos-15
            name: macOS, arm64
          - os: macos-15-intel
            name: macOS, x64

    steps:
    - uses: actions/checkout@v7
    - name: Select the Xcode
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # conan-center publishes the macOS binaries built with apple-clang 17,
        # which is the Xcode 26 of the macos-15 image, and Conan reuses them
        # only for that exact version of the compiler.  Without it, the whole
        # dependency tree is built from source on every run.
        XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
        if [ -n "${XCODE}" ]; then sudo xcode-select -s "${XCODE}"; fi
        xcode-select -p
        clang --version
    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: Install the build dependencies
      shell: bash
      run: |
        if [ "${RUNNER_OS}" == "Linux" ]; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache
        elif [ "${RUNNER_OS}" == "macOS" ]; then
          brew install ninja ccache
        elif [ "${RUNNER_OS}" == "Windows" ]; then
          # The pinned Windows profile builds with Ninja instead of MSBuild.
          # The image ships it, but it is not part of the tools it guarantees
          # (it was removed from windows-2022 for a while in 2023)
          command -v ninja >/dev/null || choco install ninja --no-progress -y
        fi
    - name: Install Conan
      run: pip3 install --break-system-packages "conan==2.33.0" || pip3 install "conan==2.33.0"
    - name: Detect the Conan profile
      run: |
        conan profile detect --force
        conan profile show
    - name: Cache the Conan packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2/p
        key: conan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conanfile.py', 'conan/profiles/**') }}
        restore-keys: |
          conan-${{ runner.os }}-${{ runner.arch }}-
    - name: Cache the compiler output
      if: runner.os != 'Windows'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ matrix.os }}
        max-size: 500M
    - run: npm install --ignore-scripts
    - name: Build the addon
      id: build
      continue-on-error: true
      shell: bash
      run: node scripts/build.mjs 2>&1 | tee build.log
    - name: Run the tests
      id: test
      if: steps.build.outcome == 'success'
      continue-on-error: true
      shell: bash
      run: npm test 2>&1 | tee test.log
      env:
        MOCHA_TEST_NETWORK: ${{ github.event.inputs.testNetwork }}
    - name: Keep the logs
      # The annotation of a check run is a summary: the whole log of a failed
      # build of the dependency tree, which is where most of the failures are,
      # does not fit there.  This step comes before the one that fails the job,
      # because a step that follows a failing step is skipped unless it opts
      # out of the shortcut of the implicit `success()` - and the log of the
      # failure itself would be the one lost with the runner
      if: steps.build.outcome == 'failure' || steps.test.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ matrix.name }}
        path: |
          build.log
          test.log
        if-no-files-found: ignore
    - name: Report the failure
      # The log of a job is only visible to the owner of the repository, but
      # the annotations of a check run are public: send the log there so that
      # a failure can be diagnosed without that access.  GitHub keeps only the
      # first 4096 characters of an annotation, so what is sent has to stay
      # well below that after the escaping of the newlines
      if: steps.build.outcome == 'failure' || steps.test.outcome == 'failure'
      shell: bash
      env:
        BUILD: ${{ steps.build.outcome }}
        TEST: ${{ steps.test.outcome }}
      run: |
        # awk, GNU and BSD sed disagree on the ':a;N;$!ba;' idiom
        escape() { awk '{gsub(/\r/,""); gsub(/%/,"%25"); printf "%s%%0A", $0}'; }
        # Only the log of the step that failed: the tail of a successful build
        # is a wall of warnings about the source of the addon, and it reads
        # like the failure that it is not
        if [ "${BUILD}" = failure ] && [ -f build.log ]; then
          echo "::error title=build.log (last 3000 characters)::$(tail -c 3000 build.log | escape)"
        fi
        # The tail of the log of a failed test run is a page of passes: put
        # the name and the error of every failing test in its own annotation
        if [ "${TEST}" = failure ] && [ -f test.log ]; then
          if grep -q '^not ok ' test.log; then
            echo "::error title=test.log (failing tests)::$(grep -A 8 '^not ok ' test.log | head -c 2500 | escape)"
          fi
          echo "::error title=test.log (last 3000 characters)::$(tail -c 3000 test.log | escape)"
        fi
        exit 1
