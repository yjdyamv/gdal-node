name: Tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      '*.md'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      testNetwork:
        description: 'Run the tests that require network connectivity'
        required: false
        default: '0'

# A push supersedes the run it interrupts: without this, every push leaves the
# jobs of the previous runs running, and this workflow takes half an hour
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:

    name: ${{ matrix.name }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux, x64
          - os: windows-2022
            name: Windows, x64
          - os: macos-15
            name: macOS, arm64

    steps:
    - uses: actions/checkout@v7
    - name: Select the Xcode
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # conan-center publishes the macOS binaries built with apple-clang 17,
        # which is the Xcode 26 of the macos-15 image, and Conan reuses them
        # only for that exact version of the compiler.  Without it, the whole
        # dependency tree is built from source on every run.
        XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
        if [ -n "${XCODE}" ]; then sudo xcode-select -s "${XCODE}"; fi
        xcode-select -p
        clang --version
    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: Install the build dependencies
      shell: bash
      run: |
        if [ "${RUNNER_OS}" == "Linux" ]; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache
        elif [ "${RUNNER_OS}" == "macOS" ]; then
          brew install ninja ccache
        elif [ "${RUNNER_OS}" == "Windows" ]; then
          # The pinned Windows profile builds with Ninja instead of MSBuild.
          # The image ships it, but it is not part of the tools it guarantees
          # (it was removed from windows-2022 for a while in 2023)
          command -v ninja >/dev/null || choco install ninja --no-progress -y
        fi
    - name: Install Conan
      run: pip3 install --break-system-packages conan || pip3 install conan
    - name: Detect the Conan profile
      run: |
        conan profile detect --force
        conan profile show
    - name: Cache the Conan packages
      uses: actions/cache@v4
      with:
        path: ~/.conan2/p
        key: conan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conanfile.py', 'conan/profiles/**') }}
        restore-keys: |
          conan-${{ runner.os }}-${{ runner.arch }}-
    - name: Cache the compiler output
      if: runner.os != 'Windows'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ matrix.os }}
        max-size: 500M
    - run: npm install --ignore-scripts
    - name: Build the addon
      id: build
      continue-on-error: true
      shell: bash
      run: node scripts/build.mjs 2>&1 | tee build.log
    - name: Run the tests
      id: test
      if: steps.build.outcome == 'success'
      continue-on-error: true
      shell: bash
      run: npm test 2>&1 | tee test.log
      env:
        MOCHA_TEST_NETWORK: ${{ github.event.inputs.testNetwork }}
    - name: Report the failure
      # The log of a job is only visible to the owner of the repository, but
      # the annotations of a check run are public: send the tail of the log
      # there so that a failure can be diagnosed without that access.  GitHub
      # keeps only the first 4096 characters of an annotation, so the tail has
      # to stay well below that after the escaping of the newlines
      if: steps.build.outcome == 'failure' || steps.test.outcome == 'failure'
      shell: bash
      run: |
        for f in build.log test.log; do
          if [ -f "${f}" ]; then
            # awk, GNU and BSD sed disagree on the ':a;N;$!ba;' idiom
            echo "::error title=${f}::$(tail -c 3000 "${f}" | awk '{gsub(/\r/,""); gsub(/%/,"%25"); printf "%s%%0A", $0}')"
          fi
        done
        exit 1
