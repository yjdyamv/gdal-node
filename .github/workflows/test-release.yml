name: Tests (release binaries)

on:
  release:
    types: [published]

  workflow_dispatch:


jobs:
  test_linux:

    name: Linux containers

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        linux-version: [ 'ubuntu:24.04', 'debian:trixie', 'amazonlinux:2023' ]
        node-version: [ 24 ]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - run: npm run container release ${{ matrix.linux-version }} ${{ matrix.node-version }}
      env:
        MOCHA_TEST_NETWORK: 1


  test_winmac:

    name: Windows and macOS

    runs-on: ${{ matrix.platforms }}

    strategy:
      matrix:
        platforms: [ windows-2022, macos-14, macos-15-intel, macos-15 ]
        node-version: [ 24 ]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - run: npm install --ignore-scripts
    - name: Download the prebuilt binary of the release
      run: node scripts/install.mjs
    - run: npx yatag
    - run: npm test
      env:
        MOCHA_TEST_NETWORK: 1
