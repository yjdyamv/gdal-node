name: Publish

on: workflow_dispatch

permissions:
  contents: write

jobs:

  create-release:

    name: Release

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Create the draft release
      # The binaries are uploaded by every job below into the release which
      # this job creates, so that the release exists exactly once, with the
      # notes which Github generates, instead of being raced into existence by
      # the first uploader
      shell: bash
      run: |
        VERSION="$(node -p 'require("./package.json").version')"
        if gh release view "v$VERSION" >/dev/null 2>&1; then
          echo "the release v$VERSION already exists"
        else
          gh release create "v$VERSION" --draft --generate-notes --title "v$VERSION"
        fi
      env:
        GH_TOKEN: ${{ github.token }}

  publish-linux:

    needs: create-release
    name: Linux

    runs-on: ubuntu-latest

    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - run: npm run container publish ubuntu:22.04 24
      env:
        NODE_PRE_GYP_GITHUB_TOKEN: ${{ github.token }}


  publish-linux-arm64:

    needs: create-release
    name: Linux arm64

    runs-on: ubuntu-24.04-arm

    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    # The binary is built in the very same ubuntu 22.04 container as the x86_64
    # one, so it needs no newer glibc than that one, even though the arm64
    # runners are 24.04
    - run: npm run container publish ubuntu:22.04 24
      env:
        NODE_PRE_GYP_GITHUB_TOKEN: ${{ github.token }}


  publish-winmac:

    needs: create-release
    name: Windows and macOS

    runs-on: ${{ matrix.platforms }}

    timeout-minutes: 120

    strategy:
      matrix:
        # N-API builds one binary per platform, valid for every supported Node.js
        platforms: [ windows-2022, windows-11-arm, macos-15-intel, macos-15 ]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Install the build dependencies
      shell: bash
      run: |
        if [ "${RUNNER_OS}" == "macOS" ]; then
          brew install ninja ccache
        elif [ "${RUNNER_OS}" == "Windows" ]; then
          # The pinned Windows profile builds with Ninja instead of MSBuild.
          # The image ships it, but it is not part of the tools it guarantees
          command -v ninja >/dev/null || choco install ninja --no-progress -y
        fi
    - name: Install Conan
      run: |
        pip install "conan==2.33.0"
        conan profile detect --force
    - name: Cache the Conan packages
      # The pinned profiles reuse the binaries of conan-center, but GDAL is
      # always built from source here, and it is most of the time of the job
      uses: actions/cache@v4
      with:
        path: ~/.conan2/p
        key: conan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conanfile.py', 'conan/profiles/**') }}
        restore-keys: |
          conan-${{ runner.os }}-${{ runner.arch }}-
    - run: npm install --ignore-scripts
    - name: Build the addon
      run: npm run build
    - run: npm test
    - name: Pack the prebuilt binary
      run: npm run package
    - run: npx @mmomtchev/node-pre-gyp-github publish
      env:
        NODE_PRE_GYP_GITHUB_TOKEN: ${{ github.token }}
